# 正式因子報告的宣告：大型＋流動性（LiquiditySize_Rank_20d）。格式見 docs/tw/FACTOR_REPORT.md。
# 作者是 RD-Agent 因子迴圈（deepseek-flash，flash 長跑第 11 輪，2026-10-25）。第一階段由 Claude 照 card.json
# 的假說轉述，不替作者補理由；作者沒寫的欄位就寫「作者未說明」。五條預測是看過研究期與保留期結果之後，
# 依作者「大型、流動性高就比較好」的一般主張推得，所以標 after_results，只能當描述。
# 第二階段（interpretation）與獨立審查（review）由 Claude 撰寫：跟作者（deepseek-flash）不同的模型（D25）。
factor:
  id: LiquiditySize_Rank_20d
  name: 大型＋流動性
  author: RD-Agent 因子迴圈（deepseek-flash，flash 長跑第 11 輪）
  pod: 風險控管  # 提議：迴圈不分家族（D20），匯出前由隊伍決定
  one_liner: 規模越大、越好交易的股票，之後表現越好
  formula: 0.5 × 排名(log 市值) + 0.5 × 排名(−ILLIQ20)；ILLIQ20 = 近 20 日「|日報酬| ÷ 成交金額」的平均（min_periods 20，成交金額 ≤ 0 當缺值）；排名每天在當月 150 檔內做，高分買進
  inputs: [$market_value, $close, $amount, $in_universe]
  data_timing: 全部是當天收盤後已知的資料：還原收盤價、原始成交金額、市值
  direction: 高分＝買進
  horizon_days: 5
  trials: 37  # 迴圈累計評分到這張為止的因子數（金絲雀 4、十輪 29、flash 第 10–11 輪 4）；上一版「小型、低流動」t 為負，迴圈看過才翻方向
  declared_on: 2026-10-26
  dplan_template: "{ticker} 市值排名第 {size_rank} 名、近 20 日日均成交 {adv_e8:.0f} 億元，屬股票池中大型且好交易的一群"
  source_authority: twse／tpex
thesis:
  mechanism_type: unknown
  concept: 大型、流動性高的股票
  story: 作者（迴圈）的假說：大型、流動性高的股票更有吸引力。前一輪的「小型」與「低流動性」因子 t 值都是負的，迴圈因此把方向翻過來；作者沒有說明為什麼大型流動股會持續較好。
  counterparty: 作者未說明。
  why_persists: 作者未說明。
  taiwan_specifics: 作者未說明。
  references: []
predictions:
  registered: after_results
  sign: positive
  peak_horizon_days: 20     # 規模是慢變數，若有溢酬應該慢慢累積
  stronger_in: none         # 一般性的大型股溢酬，兩半都該成立
  industry_neutral: survives  # 作者主張的是大小與流動性本身，不是產業組成
  regime: both
  other: []
notes: 預測由 Claude 依作者的一般主張推得（看過研究期與保留期結果之後），用來檢查這個主張有多普遍，不是作者事前登錄的預測。
# 第二階段：Claude 照 prompt_stage2.md 寫，輸入只有研究期數字與保留期「通過」。
interpretation:
  summary: 研究期 5 日 t 3.01 主要反映「大型、好交易」這個風格（跟市值、流動性各相關 0.92），而且只比 37 次嘗試下的運氣上限（約 2.69）高一點；照比賽規則買前 24 名，研究期年化只多 B0 0.83%（IR 0.11），累積還比 0050 少 87.4 個百分點。保留期通過確認，但預測是事後推的；這張比較適合當「要不要偏向權值股」的配置決定，不是選股訊號。
  concept_vs_measure: 作者說「大型、流動性高的股票更有吸引力」，公式量的就是市值與 Amihud 流動性的排名，跟兩者各相關 0.92（style_corr），持股平均落在市值第 89 百分位（holdings.size_percentile），族群以半導體 22.7%、金融 21.2%、電腦及週邊設備 16.5% 為主。量到的確實是它想量的，但「更有吸引力」只有很小的報酬證據。
  prediction_notes: 方向、最強持有期（平均 IC 從 1 日 0.0167 升到 20 日 0.0303）、大小兩半都有效（0.0185 對 0.0194）、多空頭都有效（上漲 t 2.58、下跌 t 2.13）四條支持，產業中性只剩 t 1.98（方向對、不顯著）。關係相當普遍，但強度很小：五分位 Q5−Q1 只有每 5 日 0.085%（t 0.78）。預測是看過結果才推的，只能當描述。
  alternatives:
    - 規模：跟 log 市值相關 0.92（flag mostly_size），規模本身就能解釋大部分。
    - 資料探勘：迴圈累計評分了 37 個因子，方向又是看過結果才翻的（flag data_mining_risk），t 3.01 只比運氣上限 2.69 高 0.3。
    - 獲利很小：前 24 名組合研究期年化超額 0.83%、24 日超額中位數 0.14%、勝率 51.9%（book、windows_24d）。
    - 年份不穩：超額 2022 年 −5.1%、2023 年 −4.1%、2024 年 +10.5%（by_year）。
    - 等權與市值加權：同期 0050 累積 +239.1%，組合 +151.7%（benchmarks）；在權值股領漲的行情，等權持有大型股反而落後。
    - beta：研究期對 B0 0.98，超額不是靠 beta。
  risks:
    - 中小型股反彈時會落後，因為它本質上是押規模。
    - 2022 年空頭時組合 −25.3%、B0 −20.2%（by_year），大型好交易的股票沒有提供保護。
    - 研究期對主動式 ETF 只贏 12 檔中的 2 檔（active_etfs）。
    - 跟其他含「大型流動」的組合卡相關 0.45–0.49（library_corr_top），同時用會重複押規模。
  role: style_tilt
  weight_cap_pct: 20
  pairs_with: 隊伍若決定偏向權值股，拿它控制規模曝險，搭配真正的選股訊號（例如營收類）；不要跟其他含「大型流動」的組合卡同時用。
  kill_switch: 比賽期間每 5 個交易日檢查：組合扣成本後的累積超額（對 B0）低於研究期 24 日最差 10% 的 −2.77%（windows_24d.p10_pct）時權重減半，低於 −5% 停用。
  open_questions:
    - 價值在頂部還是底部：比較「只買前 24 名」與「只剔除後 30 名、其餘等權」的研究期超額；後者明顯較好，代表有用的是避開小而不好交易的股票。
    - 等權或市值加權：同樣的前 24 名改用市值加權（遵守 10%／25% 上限）；跟 0050 的差距明顯縮小，就該用市值加權來表達大型股傾斜。
    - 流動性有沒有市值以外的資訊：流動性對 log 市值做橫斷面回歸，用殘差排名；殘差 t ≥ 2 才算有額外資訊。
  post_hoc:
    - 等權持有大型股落後 0050，可能是 2024–2026 年少數超大型權值股領漲造成的（看過研究期結果才提出）。
# 獨立審查：Claude（跟作者 deepseek-flash 不同的模型，D25）。完整 A–F 在 docs/tw/ALPHA_REVIEWS.md。
# 摘要不寫股票名稱；保留期的觀察只放 holdout_notes（--holdout full 以外不進 report.json）。
review:
  reviewer: Claude Opus 5.5（與作者 deepseek-flash 不同的模型）
  date: 2026-10-26
  judgment: 有條件合理
  summary: 只能當「偏向大型權值股」的風格決定，不是選股能力。公式就是規模與流動性（相關 0.92）；研究期 t 3.01 只比 37 次嘗試的運氣上限高一點，方向又是看過結果才翻的；照比賽規則買前 24 名，研究期幾乎沒有超額，還大幅落後市值加權的 0050。
  counterexample: 2022 年空頭時，「大而好交易」沒有提供保護：組合 −25.3%、B0 −20.2%。分數只看大小，低成長的電信股與大型金融股只因為夠大就進前 24 名。
  fix: 保留公式，縮限解釋為規模傾斜。隊伍若要大型股曝險，在 10%／25% 上限內直接用市值加權持有大型股，比等權前 24 名更直接；不要當選股訊號，也不再稱它是新 alpha。
  holdout_notes:
    - 保留期 5 日 t 3.09、24 日超額中位數 +1.23%，累積比 B0 多 16.2 個百分點，也贏過全部 21 檔投資台股的主動式 ETF。
    - 但每月超額是 +12.1%、+6.5%，之後 −1.8%、−1.2%、+0.9%、−1.0%：幾乎全部來自 5–6 月的權值股行情。
    - 保留期 beta 1.20；大型半的 IC 是負的（−0.026），前 10 名的 24 日超額中位數 −0.62%。
