# 正式因子報告的宣告：營收殖利率＋大型流動（SalesYield_LiquiditySize_70_30）。格式見 docs/tw/FACTOR_REPORT.md。
# 作者是 RD-Agent 因子迴圈（deepseek-flash，flash 長跑第 18 輪，2026-10-25）。第一階段由 Claude 照 card.json
# 的假說轉述，不替作者補理由；作者沒寫的欄位就寫「作者未說明」。五條預測是看過研究期與保留期結果之後，
# 依作者「以營收看較便宜、又大又好交易就比較好」的一般主張推得，所以標 after_results，只能當描述。
# 第二階段（interpretation）與獨立審查（review）由 Claude 撰寫：跟作者（deepseek-flash）不同的模型（D25）。
factor:
  id: SalesYield_LiquiditySize_70_30
  name: 營收殖利率＋大型流動
  author: RD-Agent 因子迴圈（deepseek-flash，flash 長跑第 18 輪）
  pod: 營收獲利動能  # 提議：五大因子裡唯一用到營收的家族；它其實是估值訊號，不是動能。匯出前由隊伍決定
  one_liner: 以營收來看較便宜、又大又好交易的股票，之後表現較好
  formula: 0.7 × 排名(12 × 最新月營收 ÷ 市值) + 0.3 × [0.5 × 排名(log 市值) + 0.5 × 排名(−ILLIQ20)] − 1；ILLIQ20 同「大型＋流動性」；排名每天在當月 150 檔內做，高分買進
  inputs: [$rev, $market_value, $close, $amount, $in_universe]
  data_timing: 月營收用公告後的版本（有 create_time 就從那天起，否則次月 10 日）；其餘是當天收盤後已知的資料
  direction: 高分＝買進
  horizon_days: 5
  trials: 57  # 迴圈累計評分到這張為止的因子數（金絲雀 4、十輪 29、flash 第 10–18 輪 24）；單純營收殖利率（第 16 輪）t 2.74 沒過，加入已通過的「大型＋流動性」後才過
  declared_on: 2026-10-26
  dplan_template: "{ticker} 最新月營收年化後是市值的 {sales_yield:.2f} 倍（股票池第 {sy_rank} 名），市值排名第 {size_rank} 名"
  source_authority: mops／twse／tpex
thesis:
  mechanism_type: unknown
  concept: 以營收衡量較便宜（營收倍數低），並偏向大型、好交易的股票
  story: 作者（迴圈）的假說：營收相對市值越高代表越便宜，再加上大型與流動性，代表需求有被確認；分數越高越值得買。作者沒有說明便宜為什麼會變成之後的超額報酬，也沒說明為什麼要用營收而不是獲利。（迴圈紀錄：單純的營收殖利率在第 16 輪研究期 t 2.74，沒過門檻；加上已通過的「大型＋流動性」後才過。）
  counterparty: 作者未說明。
  why_persists: 作者未說明。
  taiwan_specifics: 作者未說明。
  references: []
predictions:
  registered: after_results
  sign: positive
  peak_horizon_days: 20       # 估值是慢變數，作者也說它換手低
  stronger_in: none           # 一般性的「便宜」溢酬
  industry_neutral: survives  # 若真的是「比同業便宜」，同族群內比較也該成立
  regime: both
  other: []
notes: 預測由 Claude 依作者的一般主張推得（看過研究期與保留期結果之後），用來檢查這個主張有多普遍，不是作者事前登錄的預測。
# 第二階段：Claude 照 prompt_stage2.md 寫，輸入只有研究期數字與保留期「通過」。
interpretation:
  summary: 研究期 5 日 t 3.15，但它幾乎就是營收殖利率（相關 0.94）；優勢集中在 2021–2023 年（超額 +31.5%、+14.2%、+22.3%），2025 年與 2026 年 1–4 月反而落後 B0 18.0% 與 21.6%；效果幾乎只出現在大盤下跌時（下跌 IC t 5.66、上漲 t 0.30）和小型半（t 4.04，大型半 0.8）。保留期通過確認，但從研究期看它是「跌市較抗跌」的價值／防守部位，不是全天候的選股訊號；預測是事後推的，只能當描述。
  concept_vs_measure: 作者說「以營收看較便宜，又大又好交易」。公式 70% 是營收殖利率排名，跟單純營收殖利率相關 0.94，跟淨值市價比 0.47、盈餘殖利率 0.42、規模 0.42（style_corr）。營收殖利率 = 盈餘殖利率 ÷ 淨利率，所以利潤率低的公司也會被算成便宜，公式分不出是股價便宜還是利潤薄；持股以電腦及週邊設備 29.3%、半導體 14.2%、航運 12.7% 為主（holdings）。
  prediction_notes: 方向、最強持有期（平均 IC 從 1 日 0.0172 升到 20 日 0.0461）和產業中性（t 3.96，比原始的 3.15 還高）支持「同業間營收倍數低」的說法。「大小兩半都有效」沒有支持：小型半 0.0394（t 4.04）、大型半 0.0076（t 0.8），差的 t 2.96；「多空頭都有效」只有方向對：下跌時 0.0671（t 5.66）、上漲時 0.0031（t 0.30）。它是集中在中小型股、在跌市發揮的價值訊號。
  alternatives:
    - 營收殖利率本身：相關 0.94（flag mostly_sales_yield）；單純營收殖利率當初研究期沒過門檻，加上已通過的大型流動卡才過。
    - 資料探勘：迴圈累計評分了 57 個因子，純運氣上限約 2.84，t 3.15 只高 0.3（flag data_mining_risk）。
    - 年份不穩：IC 2024 年 0.0037、2025 年 0.0212、2026 年 1–4 月 −0.0814（ic_by_year），超額由正轉負。
    - 低 beta：對 B0 的 beta 0.85，又只在跌市有效，部分超額可能只是防守性質。
    - 五分位不單調：Q2 最差（−0.141%），Q5−Q1 只有 0.036%（t 0.24），強度主要在中段排序，不在兩端。
    - 同期行情：研究期能比的 12 檔主動式 ETF 全輸，中位數少 49.8%；同一段日子主動式 ETF 平均 +131.3%、組合只有 +27.3%（benchmarks、active_etfs）。
    - 成本不是問題：換手 2.1%，成本加倍後年化超額仍有 5.41%。
  risks:
    - 大盤上漲時幾乎無效（market_up IC 0.0031）；比賽 24 日若是多頭，會落後。
    - 研究期最後兩年由正轉負，優勢可能正在消失。
    - 持股集中在電腦及週邊設備 29.3%，等於押薄利的代工與通路。
    - 只用單月營收 × 12，季節性強的公司排名會每月跳動。
  role: style_tilt
  weight_cap_pct: 20
  pairs_with: 跟偏多頭時有效的訊號互補（例如營收類或動能類；組合效果要另外驗證），由它負責跌市的防守。
  kill_switch: 比賽期間每 5 個交易日檢查：組合扣成本後的累積超額（對 B0）低於研究期 24 日最差 10% 的 −3.96%（windows_24d.p10_pct）時權重減半，低於 −8% 停用。
  open_questions:
    - 價格便宜或利潤薄：用盈餘殖利率取代營收殖利率、其餘不變，比較研究期 IC。持平或更好，訊號來自價格；明顯變弱，來自薄利產業。
    - 防守或選股：把分數對 60 日 beta 做橫斷面中性化，看跌市 IC 是否還在。還在，代表是選股；消失，代表主要是低 beta。
    - 大型股能不能用：只在市值前一半裡排名。研究期 t < 2，代表比賽偏大型的持股要降低它的權重。
  post_hoc:
    - 2025 年後落後，可能是 AI 行情下高本益比成長股大漲（看過研究期結果才提出）。
# 獨立審查：Claude（跟作者 deepseek-flash 不同的模型，D25）。完整 A–F 在 docs/tw/ALPHA_REVIEWS.md。
# 摘要不寫股票名稱；保留期的觀察只放 holdout_notes（--holdout full 以外不進 report.json）。
review:
  reviewer: Claude Opus 5.5（與作者 deepseek-flash 不同的模型）
  date: 2026-10-26
  judgment: 有條件合理
  summary: 可以當「營收倍數低、跌市較抗跌」的價值／防守部位，但不能說成「便宜」：營收殖利率 = 盈餘殖利率 ÷ 淨利率，高分有一大部分是薄利產業。研究期的效果只在跌市（t 5.66）與小型半（t 4.04）出現，2024 年後由正轉負；t 3.15 也只比 57 次嘗試的運氣上限高一點。
  counterexample: 2025 年到 2026 年 4 月，分數最高的是營收大、毛利薄的伺服器代工與電子通路，組合落後 B0 18.0% 與 21.6%；同期投資台股的主動式 ETF 平均 +131.3%，組合只有 +27.3%。「營收倍數低」在成長股主導的行情裡會長期落後。
  fix: 縮限解釋為「營收倍數低，跌市較抗跌」；單月營收改近 12 個月加總；單一族群上限約 25%；要宣稱同業間便宜就改用同族群內排名（研究期 t 3.96 支持）。這些變形只能在研究期評分，比賽期間才算確認。
  holdout_notes:
    - 保留期 5 日 t 2.63、24 日超額中位數 +2.50%，累積比 B0 多 22.0 個百分點，也贏過全部 21 檔投資台股的主動式 ETF；beta 0.72。
    - 每月超額 +9.9%、−0.9%、+11.1%、−7.1%、+0.7%、+3.8%：7 月大跌時贏、8 月反彈時輸。
    - 保留期跌市 IC 0.215（t 8.85）、漲市 −0.005：研究期看到的「只在跌市有效」在保留期再次出現。保留期 10/25 已用過一次，這算一致，不算新的確認；也代表多頭時不要期待它。
