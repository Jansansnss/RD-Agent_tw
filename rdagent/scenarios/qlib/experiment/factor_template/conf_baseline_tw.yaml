qlib_init:
    provider_uri: "~/.qlib/qlib_data/tw_data"
    region: tw

market: &market tw50
benchmark: &benchmark 0050.TW

data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2015-01-01", true) }}
    end_time: {{ test_end | default("null", true) }}
    instruments: *market
    data_loader:
        class: StaticDataLoader
        module_path: qlib.data.dataset.loader
        kwargs:
            config:
                feature:
                    - [tw_daily.h5, data]
            join: outer

    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: {{ train_start | default("2015-01-01", true) }}
              fit_end_time: {{ train_end | default("2020-12-31", true) }}
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 30
            n_drop: 5
    backtest:
        start_time: {{ test_start | default("2021-01-01", true) }}
        end_time: {{ test_end | default("null", true) }}
        account: 10000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.099          # Taiwan ±10% daily limit
            deal_price: close
            open_cost: 0.001425             # 0.1425% brokerage (buy)
            close_cost: 0.004425            # 0.1425% brokerage + 0.3% transaction tax (sell)
            min_cost: 20                    # min TWD per trade

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2015-01-01", true) }}, {{ train_end | default("2020-12-31", true) }}]
                valid: [{{ valid_start | default("2021-01-01", true) }}, {{ valid_end | default("2021-12-31", true) }}]
                test:  [{{ test_start  | default("2022-01-01", true) }}, {{ test_end  | default("null", true) }}]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
