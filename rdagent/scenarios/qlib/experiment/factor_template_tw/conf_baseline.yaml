qlib_init:
    provider_uri: "~/.qlib/qlib_data/tw_data"
    region: cn   # cn calendar/expression engine — TW-specific holidays not yet wired

# Universe = every code in instruments/all.txt (just the smoke-test blue chips today).
# TODO: add a real `tw50.txt` that lists 0050 ETF constituents with point-in-time
# dates so backtest can use the same filter the strategy invests in.
market: &market all
# Benchmark: TODO ingest TAIEX / 0050.TW into bin format. Using 2330 (TSMC) as a
# placeholder so PortAnaRecord doesn't crash — clearly biased, replace before any
# performance claim.
benchmark: &benchmark "2330"

data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2018-01-01", true) }}
    end_time: {{ test_end | default("null", true) }}
    instruments: *market
    data_loader:
        class: qlib.contrib.data.loader.Alpha158DL
        kwargs:
            config:
                label:
                    - ["Ref($close, -2)/Ref($close, -1) - 1"]
                    - ["LABEL0"]
                feature:
                    - {{ feature_expressions }}
                    - {{ feature_names }}

    infer_processors:
        - class: RobustZScoreNorm
          kwargs:
              fields_group: feature
              clip_outlier: true
              fit_start_time: {{ train_start | default("2018-01-01", true) }}
              fit_end_time:   {{ train_end   | default("2022-12-31", true) }}
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 3      # tiny universe — keep this small
            n_drop: 1
    backtest:
        start_time: {{ test_start | default("2024-01-01", true) }}
        end_time:   {{ test_end   | default("null", true) }}
        account: 10000000              # 10M TWD
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.099     # ±10% daily limit
            deal_price: close
            open_cost:  0.001425       # 0.1425% brokerage
            close_cost: 0.004425       # 0.1425% brokerage + 0.3% transaction tax
            min_cost: 20               # minimum TWD per trade

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8
            learning_rate: 0.05
            subsample: 0.8
            lambda_l1: 0.1
            lambda_l2: 0.1
            max_depth: 4
            num_leaves: 15
            num_threads: 8
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2018-01-01", true) }}, {{ train_end | default("2022-12-31", true) }}]
                valid: [{{ valid_start | default("2023-01-01", true) }}, {{ valid_end | default("2023-12-31", true) }}]
                test:  [{{ test_start  | default("2024-01-01", true) }}, {{ test_end  | default("null", true) }}]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
