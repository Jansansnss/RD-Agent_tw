qlib_init:
    provider_uri: "~/.qlib/qlib_data/{{ dataset_name | default('tw_data', true) }}"
    region: cn

market: &market all
benchmark: &benchmark "2330"

# Same as conf_baseline.yaml but stacks LLM-generated factors (combined_factors_df.parquet,
# written by QlibFactorRunner) on top of the Alpha158 base feature set.
data_handler_config: &data_handler_config
    start_time: {{ train_start | default("2022-01-01", true) }}
    end_time: {{ test_end | default("null", true) }}
    instruments: *market
    data_loader:
        class: NestedDataLoader
        kwargs:
            dataloader_l:
                - class: qlib.contrib.data.loader.Alpha158DL
                  kwargs:
                    config:
                        label:
                            - ["Ref($close, -2)/Ref($close, -1) - 1"]
                            - ["LABEL0"]
                        feature:
                            - {{ feature_expressions }}
                            - {{ feature_names }}
                - class: qlib.data.dataset.loader.StaticDataLoader
                  kwargs:
                    config: "combined_factors_df.parquet"

    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 3
            n_drop: 1
    backtest:
        start_time: {{ test_start | default("2024-01-01", true) }}
        end_time:   {{ test_end   | default("null", true) }}
        account: 10000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.099
            deal_price: close
            open_cost:  0.001425
            close_cost: 0.004425
            min_cost: 20

task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8
            learning_rate: 0.05
            subsample: 0.8
            lambda_l1: 0.1
            lambda_l2: 0.1
            max_depth: 4
            num_leaves: 15
            num_threads: 8
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: DataHandlerLP
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [{{ train_start | default("2022-01-01", true) }}, {{ train_end | default("2023-06-30", true) }}]
                valid: [{{ valid_start | default("2023-07-01", true) }}, {{ valid_end | default("2023-12-31", true) }}]
                test:  [{{ test_start  | default("2024-01-01", true) }}, {{ test_end  | default("null", true) }}]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
